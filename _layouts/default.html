<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header class="site-header">
    <div class="site-masthead">
      <svg width="52" height="34" viewBox="0 0 52 34" aria-hidden="true">
        <polygon points="0,0 52,7 43,17 52,27 0,34" fill="#C8102E"/>
        <polygon points="21,10 23.1,16.5 30,16.5 24.5,20.4 26.6,26.9 21,23 15.4,26.9 17.5,20.4 12,16.5 18.9,16.5" fill="white"/>
      </svg>
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
    </div>
    <div class="gold-stripe"></div>
    <div class="site-header-lower">
      <p class="site-description">{{ site.description }}</p>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/hull-401' | relative_url }}">Hull 401</a>
        <a href="{{ '/titanics-people' | relative_url }}">Titanic's People</a>
        <a href="{{ '/the-long-sinking' | relative_url }}">The Long Sinking</a>
        <a href="{{ '/160-minute-dance-with-history' | relative_url }}">160 Minute Dance with History</a>
        <a href="{{ '/about' | relative_url }}">About</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>401-MGY · Built in Belfast · Lost at 41°46′N 50°14′W</p>
  </footer>

</body>
</html>
